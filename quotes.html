<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes · Jerry</title>
  <link rel="icon" href="biuh.lake.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <h1>Quotes</h1>
    <p>Things worth reading twice — each with who said it, and where.</p>

    <article class="quote">
      <blockquote>
        <p>This is for everyone.</p>
      </blockquote>
      <footer>
        <cite>Tim Berners-Lee</cite>,
        <span class="source">London Olympic opening ceremony, 2012</span>
      </footer>
      <button class="likeBtn">❤️ like <span class="likeCount">0</span></span></button>
    </article>

    <article class="quote">
      <blockquote>
        <p lang="zh">千里之行，始于足下。</p>
        <p>A journey of a thousand miles begins beneath your feet.</p>
      </blockquote>
      <footer>
        <cite>Laozi</cite>,
        <span class="source">Tao Te Ching, chapter 64</span>
      </footer>
      <button class="likeBtn">❤️ like <span class="likeCount">0</span></span></button>
    </article>

    <!-- one <article> per quote — twenty in total -->
  </main>

  <footer id="site-footer"></footer>

  <script src="nav.js"></script>
  <script src="likes.js"></script>
</body>
</html>
